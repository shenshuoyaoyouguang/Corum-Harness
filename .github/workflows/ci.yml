name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 目标平台是 macOS（Apple Silicon）+ Linux + Windows。
    # macOS：Seatbelt 沙箱相关的断言只有 macOS 能跑（profiles.spec.ts 的 SBPL）。
    # Linux：可移植性核对（路径语义同 Unix）。
    # Windows：产品路径编码/沙箱形态不同，已通过 skipIf(win32) 分类处理
    # （见 tests 内的 skipIf 注释：macOS Seatbelt 专有断言保留 skip + 注释点明产品事实；
    # 可平台无关表达的用例已转正；win32 专例用 skipIf(!isWin32) 限定）。
    # fail-fast: false 让三个平台各自独立出结论，Windows 失败不阻断其他平台。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    name: verify · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fold-equivalence.spec.ts 依赖 git 历史（在历史提交里找回原始 fold 原文）；
          # 默认 shallow clone 会让该判据 fail-loud
          fetch-depth: 0

      # 版本取自 package.json 的 packageManager 字段（pnpm@11.7.0）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 必须在 Test 之前：测试会解析 workspace 包的 lib/ 产物
      # （否则报 `Failed to resolve entry for package "@corum/..."`）
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # 无 DSH_CHECKOUT 时逐字节比对断言自动跳过（并逐条标注），
      # 事件一致性 / 挂载点 / inline-css 等本机断言仍然执行。
      - name: Fork-drift guard
        run: pnpm guard