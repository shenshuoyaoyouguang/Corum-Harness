name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # 手动触发 fork-drift-byte 全量字节比对（见下）

# ── 单点基线（Phase 1.2）────────────────────────────────────────────────
# fork-drift 字节比对的官方基线 tag。改这一处，CI clone 与 guard 共用。
# ⚠ 必须与 pnpm-workspace.yaml 的 dsh overrides 实际安装版本对账；
#   docs/fork-delta.md 的逐文件台账基线若滞后（当前台账停 0.1.3-alpha.1、
#   实装 0.1.5-rc.3），需先重新对账再动此值，否则字节断言会长期假红。
env:
  DSH_BASELINE_TAG: dsh-v0.1.5-rc.3

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 目标平台是 macOS（Apple Silicon）+ Linux + Windows。
    # macOS：Seatbelt 沙箱相关的断言只有 macOS 能跑（profiles.spec.ts 的 SBPL）。
    # Linux：可移植性核对（路径语义同 Unix）。
    # Windows：产品路径编码/沙箱形态不同，已通过 skipIf(win32) 分类处理
    # （见 tests 内的 skipIf 注释：macOS Seatbelt 专有断言保留 skip + 注释点明产品事实；
    # 可平台无关表达的用例已转正；win32 专例用 skipIf(!isWin32) 限定）。
    # fail-fast: false 让三个平台各自独立出结论，Windows 失败不阻断其他平台。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    name: verify · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fold-equivalence.spec.ts 依赖 git 历史（在历史提交里找回原始 fold 原文）；
          # 默认 shallow clone 会让该判据 fail-loud
          fetch-depth: 0

      # 版本取自 package.json 的 packageManager 字段（pnpm@11.7.0）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Typecheck
        run: pnpm typecheck
        timeout-minutes: 15

      # (Phase 1.3) oxlint：零配置秒级 lint。初始 continue-on-error=true —— 先看全仓
      # lint 面（correctness 类只 warn 不阻断），triage 修复后删 continue-on-error 让它
      # 真正阻断、并把 oxlint 钉成 devDep 以可复现。配置见根 oxlintrc.json。
      - name: Lint (oxlint)
        run: npx -y oxlint@latest packages/ scripts/
        timeout-minutes: 5
        continue-on-error: true

      # 必须在 Test 之前：测试会解析 workspace 包的 lib/ 产物
      # （否则报 `Failed to resolve entry for package "@corum/..."`）
      - name: Build
        run: pnpm build
        timeout-minutes: 20

      - name: Test
        run: pnpm test
        timeout-minutes: 20

      # PR 快速通道：本机断言（事件一致性 / 挂载点 / inline-css）。
      # 字节比对在 fork-drift-byte job（main / 手动触发）跑——PR 上不拉官方检出。
      - name: Fork-drift guard (local assertions)
        run: pnpm guard
        timeout-minutes: 10

      # (Phase 0.1) 计时基线：GitHub UI 已显示每步耗时；此处落一份 run 上下文到
      # step summary，便于跨 run 对比 Phase 2 提速效果。
      - name: Run summary
        if: always()
        run: |
          echo "## CI run · ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${{ github.ref_name }}\`  sha: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- baseline tag: \`${{ env.DSH_BASELINE_TAG }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 各步耗时见 Actions UI；以此 run 为 Phase 2 提速对比基线。" >> "$GITHUB_STEP_SUMMARY"

      # (Phase 1.4) 失败保留产物：build 产物直接下载排障，不必重跑。
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ matrix.os }}
          path: |
            packages/desktop/lib/
            packages/desktop/dist/
          if-no-files-found: ignore
          retention-days: 7

  # (Phase 1.1) fork-drift 字节比对 —— 项目招牌守卫，此前在 CI 里因无 DSH_CHECKOUT
  # 被整个跳过（verify-fork-drift.sh 头部：无检出时字节断言 skip）。本 job 拉官方基线
  # 检出再跑全量 guard。仅 main push + 手动触发跑（PR 走 verify job 的本机断言即可）。
  #
  # 初始各步 continue-on-error=true：先看 drift 面（台账基线 0.1.3-alpha.1 vs 实装
  # 0.1.5-rc.3，字节 diff 可能红——这正是要看见的信号）。triage 后逐项修，再删
  # continue-on-error 让它真正守 main。
  fork-drift-byte:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: fork-drift byte guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch dsh baseline
        id: baseline
        continue-on-error: true
        run: |
          git clone --depth 1 --branch "${DSH_BASELINE_TAG}" \
            https://github.com/deepseek-ai/deepseek-harness.git /tmp/dsh

      - name: Fork-drift byte guard (full)
        if: steps.baseline.outcome == 'success'
        continue-on-error: true
        env:
          DSH_CHECKOUT: /tmp/dsh
          DSH_BASELINE_TAG: ${{ env.DSH_BASELINE_TAG }}
        run: |
          bash scripts/verify-fork-drift.sh 2>&1 | tee guard-output.txt

      - name: Upload guard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-drift-byte-output
          path: guard-output.txt
          if-no-files-found: ignore
          retention-days: 14
