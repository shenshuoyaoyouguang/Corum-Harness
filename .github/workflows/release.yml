name: release

# 发布：tag（v*）触发 → 三平台出包 → 更新日志 → 建 **draft** Release（人工核对后点 Publish）。
#
# 融合两条既有发布链的教训：
# - 本地（0.3.0 前）：① 必须 `pnpm run pack`，不能写 `pnpm pack`（后者是 pnpm 内置
#   命令打 tarball，不跑同名脚本）；② 必须先全仓 `pnpm build`——pack:host 的
#   `pnpm deploy` 物化工作区包闭包（读各包 lib/），否则干净检出出残缺闭包；
# - 上游：三平台（darwin/linux/win32）各自本机 install→build→pack，交叉打包已证伪；
#   pack.mjs 四步链自带平台钉死 + 烘入常量 + 运行时一致性断言；产物内部混装由
#   corum-smoke 抓。
#
# 形态固定为 **draft**：未签名 + 首跑风险 ⇒ 先验产物再人工点 Publish。
# 产物事实：未签名（无 mac.identity / 无 Windows 证书）、mac 仅 arm64（dmg+zip）、
# Linux AppImage+deb、Windows NSIS x64（+zip）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.3.0）；彩排可留空'
        required: false
      dry_run:
        description: '彩排：只构建、不建 Release'
        type: boolean
        default: true

# 默认只读；只有 publish 提权（least privilege）。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # 发布绝不半途取消

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}

jobs:
  # ── 门禁：tag ↔ 版本 ↔ 分支 ────────────────────────────────────────────────
  gate:
    name: gate · tag ↔ version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 版本一致性与 tag 归属
        run: |
          set -euo pipefail
          root=$(node -p "require('./package.json').version")
          desk=$(node -p "require('./packages/desktop/package.json').version")
          echo "root=$root desktop=$desk tag=${RELEASE_TAG:-<none>} dry_run=$DRY_RUN"
          [ "$root" = "$desk" ] || {
            echo "::error::两处 package.json 版本不一致（根 $root / desktop $desk）——先跑 node scripts/release.mjs --write"
            exit 1
          }
          if [ "$DRY_RUN" = "1" ]; then
            echo "::notice::彩排模式——跳过 tag ↔ 版本、tag 在 main 上 两项校验"
            exit 0
          fi
          [ -n "$RELEASE_TAG" ] || { echo "::error::非彩排的手动触发必须给 tag 输入"; exit 1; }
          [ "$RELEASE_TAG" = "v$root" ] || {
            echo "::error::tag $RELEASE_TAG 与版本 v$root 不一致（tag 约定 = v + 版本号）"
            exit 1
          }
          git fetch --quiet origin main
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          git merge-base --is-ancestor "$tag_sha" origin/main || {
            echo "::error::tag 提交 $tag_sha 不在 origin/main 上——只从 main 出包"
            exit 1
          }
          echo "::notice::gate 通过：$RELEASE_TAG @ $tag_sha 在 origin/main 上"

  # ── 构建：三平台各自出安装包（本机 install→build→pack，互不交叉）──────────
  package:
    name: package ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin, os: macos-latest,  platform: darwin, arch: arm64 }
          - { target: linux,  os: ubuntu-latest, platform: linux,  arch: x64   }
          - { target: win32,  os: windows-latest, platform: win32, arch: x64   }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Linux 出包前置（AppImage 需 libfuse2）
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 rpm

      # 必须先全仓 build：pack:host 的 pnpm deploy 物化闭包时读各包 lib/（见文件头）。
      - name: Build（全量）
        run: pnpm build
        timeout-minutes: 25

      - name: Pack ${{ matrix.target }}（四步链 + 平台钉死）
        working-directory: packages/desktop
        run: node scripts/pack.mjs ${{ matrix.target }} --arch=${{ matrix.arch }}
        shell: bash
        timeout-minutes: 45
        env:
          # 本仓无签名证书：显式关掉证书自动发现，省掉 mac 上必然失败的签名探测。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke（产物内部混装守卫）
        run: node scripts/corum-smoke.mjs --fast
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CDP_PORT: 9333

      # fail-closed：产物没出来就必须红，绝不让 publish 拿到空 artifacts。
      - name: 断言产物存在
        shell: bash
        run: |
          set -euo pipefail
          ls -la packages/desktop/dist || true
          n=$(find packages/desktop/dist -maxdepth 1 \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) \
            2>/dev/null | wc -l || true)
          [ "$n" -ge 1 ] || { echo "::error::${{ matrix.target }} 未产出安装包（dist/ 清单见上）"; exit 1; }
          echo "::notice::${{ matrix.target }} 安装包 $n 个，进入 artifact"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corum-${{ matrix.target }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  # ── 发布：三平台都成功才建 Release（原子）；形态为 draft ───────────────────
  publish:
    name: publish · draft release
    needs: package
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write             # 建 Release 需要；其余 job 保持只读
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install（release.mjs 依赖）
        run: pnpm install --frozen-lockfile

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成发布说明（release.mjs，基线 = 上一个 tag）
        run: |
          set -euo pipefail
          {
            echo "## 安装提示（未签名构建）"
            echo ""
            echo "- **macOS（仅 Apple Silicon / arm64）**：首次打开若被 Gatekeeper 拦，右键 →「打开」；或执行"
            echo '  `xattr -dr com.apple.quarantine /Applications/Corum.app`'
            echo "- **Windows**：SmartScreen 提示时选「更多信息」→「仍要运行」"
            echo "- **Linux**：AppImage 需本机有 libfuse2（`chmod +x` 后直接运行）；或安装 deb"
            echo ""
          } > notes.md

          # 绝不能省略 --since（否则 release.mjs 的「最近 tag」就是自己 ⇒ 0 提交 ⇒ 退出 1）。
          prev=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "::warning::找不到上一个 tag——本次只产出安装提示，更新日志请手补"
          elif node scripts/release.mjs --since="$prev" > preview.txt 2>&1; then
            sed -n '/^## TOP5 更新日志/,$p' preview.txt | sed '/^（预览模式/,$d' >> notes.md
            echo "::notice::发布说明基线 = $prev"
          else
            echo "::warning::release.mjs 未产出（基线 $prev）——本次只产出安装提示，更新日志请手补"
            tail -20 preview.txt || true
          fi
          echo '--- notes.md ---'; cat notes.md

      # 幂等：同名 release 已存在则补传产物，不重复建。
      - name: 建 draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          ls -la artifacts
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release $RELEASE_TAG 已存在——补传/覆盖产物"
            gh release upload "$RELEASE_TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Corum $ver" --draft --notes-file notes.md artifacts/*
          fi
          echo "::notice::完成——到 Releases 页面核对产物与说明，确认无误后点 Publish"